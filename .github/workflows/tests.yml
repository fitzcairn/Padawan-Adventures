name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Runner images install every Xcode under a fully versioned path, and
        # only keep the newest few. Our 26.5 deployment target needs Xcode 26.5+.
        run: |
          app="$(ls -d /Applications/Xcode_26*.app 2>/dev/null \
            | grep -E '^/Applications/Xcode_26(\.[0-9]+)+\.app$' \
            | sort -V | tail -1)"
          if [ -z "$app" ]; then
            echo "No Xcode 26.x on this runner:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -switch "$app"
          xcodebuild -version

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Run unit tests
        env:
          SIMULATOR_NAME: iPhone 17
          SIMULATOR_OS: latest
        run: ./scripts/run_tests.sh
