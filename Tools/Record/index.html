<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Padawan Adventures — Audio Recorder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <h1>Audio Recorder</h1>
      <label class="check">
        <input type="checkbox" id="autosave" />
        Autosave on record
      </label>
      <label class="filter">
        Filter
        <input type="search" id="filter" placeholder="word, letter, UI…" autocomplete="off" />
      </label>
      <label class="check" title="Missing clips and placeholder beeps">
        <input type="checkbox" id="unrecorded" />
        Unrecorded only
      </label>
      <span id="mic-status" class="mic-status" data-state="idle">Mic: not started</span>
      <span id="notch-status" class="mic-status" data-state="idle" hidden></span>
      <span class="hint">↑↓ select · Space hold to record · B play · Enter play saved · ⌘S save</span>
    </header>

    <main>
      <table id="table">
        <colgroup id="colgroup">
          <col class="col-text" />
          <col class="col-spoken" />
          <col class="col-context" />
          <col class="col-clip" />
          <col class="col-mtime" />
          <col class="col-record" />
          <col class="col-take" />
          <col class="col-save" />
          <col class="col-status" />
        </colgroup>
        <thead>
          <tr>
            <th aria-sort="none"><button type="button" class="sort" data-sort="text" title="Click to sort">Text</button></th>
            <th aria-sort="none"><button type="button" class="sort" data-sort="spoken" title="Click to sort">Spoken</button></th>
            <th aria-sort="none"><button type="button" class="sort" data-sort="context" title="Click to sort">Context</button></th>
            <th aria-sort="none"><button type="button" class="sort" data-sort="clip" title="Click to sort">Current clip</button></th>
            <th aria-sort="none"><button type="button" class="sort" data-sort="mtime" title="Click to sort">Last updated</button></th>
            <th aria-sort="none"><button type="button" class="sort" data-sort="record" title="Click to sort">Record</button></th>
            <th aria-sort="none"><button type="button" class="sort" data-sort="take" title="Click to sort">Play recording</button></th>
            <th aria-sort="none"><button type="button" class="sort" data-sort="save" title="Click to sort">Save</button></th>
            <th aria-sort="none"><button type="button" class="sort" data-sort="status" title="Click to sort">Status</button></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
