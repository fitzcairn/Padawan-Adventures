# Cutscene characters. Both sheets ship with real alpha, so no chroma key:
# keying black here would eat outlines on dark robe edges.
player:
  sprite:
    root: Sprites/UI/Cutscene
    animations:
      idle:
        sheet: kam-idle_right-spritesheet
        atlas: kam-idle_right-atlas

yoda:
  sprite:
    root: Sprites/UI/Cutscene
    animations:
      idle:
        sheet: yoda-talking-spritesheet
        atlas: yoda-talking-atlas
