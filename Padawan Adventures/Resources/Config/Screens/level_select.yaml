# Level-select screen. Planet sprite ids are referenced by level YAML `level_sprite:`.
music: menu_theme

tython:
  sprite:
    root: Sprites/UI/Levels
    chroma_key: "#000000"
    chroma_key_tolerance: 2
    animations:
      idle:
        sheet: 1-tython
        atlas: 1-tython-atlas

