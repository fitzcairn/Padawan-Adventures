# Padawan Adventures — world (v1)
# All procedural generation is deterministic for a given seed + params.
# Use `seed: time` for a fresh seed from the clock on each new game, or a number to fix it.
# Map size, generation knobs, and enemy spawn live in Levels/_defaults.yaml / Config/Levels/*.yaml.

version: 1
seed: time

# Testing shortcut: replace every level layout with a fixed three-room demo map
# that shows one of every gate, pit, and combat minigame plus every enemy type.
demo_mode: false

# First-visit world (Tython) and minigame tutorial overlays.
tutorials: false

# 4-digit Dad mode unlock on the level select screen.
dad_mode_password: "1234"

display:
  tile_width_points: 80
  tile_height_points: 49
  # Auto-dismiss delay for overlays (tap also dismisses).
  overlay_dismiss_seconds: 6
