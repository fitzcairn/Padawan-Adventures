# Player defaults for a new game (HUD starts with these heart / lightning counts).

letter: P
starting_health: 1
starting_energy: 2

# Event key → sound track basename (Resources/Audio/FX/<name>.m4a).
fx:
  move: world-player-step
  pickup_health: pickup-health
  pickup_energy: pickup-energy
  pickup_treasure: pickup-treasure
  pit: pit-start
  damage: combat-damage
  enemy_damage: combat-enemy-damage
  combat_start: combat-start-lightsaber-ignite
  combat_loop: combat-loop-lightsaber-hum
  slash: combat-lightsaber-slash
  slash_hit: lightsaber-cut
  deflect: combat-lightsaber-deflect
  jump: pit-jump
  scan: satellite-scan

# Animated sprite sheets under Resources/Sprites/Player/<name>/.
# Cardinals: up / down / left / right. Diagonals keep compass names.
# left / northwest / southwest reuse right / northeast / southeast via flip.
sprite:
  root: Sprites/Player
  chroma: black
  height_fraction: 1.08
  # Percent of scaled height; nudges sprite toward bottom of screen (feet into tile).
  anchor_correction_percent: 7
  animations:
    idle_up: { sheet: idle_up-spritesheet, atlas: idle_up-atlas }
    idle_northeast: { sheet: idle_northeast-spritesheet, atlas: idle_northeast-atlas }
    idle_northwest: { flip_of: idle_northeast }
    idle_right: { sheet: idle_right-spritesheet, atlas: idle_right-atlas }
    idle_left: { flip_of: idle_right }
    idle_southeast: { sheet: idle_southeast-spritesheet, atlas: idle_southeast-atlas }
    idle_southwest: { flip_of: idle_southeast }
    idle_down: { sheet: idle_down-spritesheet, atlas: idle_down-atlas }
    # walk_down / walk_southeast were drawn oversized against the idle sheets (both head
    # and overall height), so `bake_scale` brings them back in line. The other walk sheets
    # differ in proportion rather than scale, which a single factor cannot correct.
    walk_up: { sheet: walk_up-spritesheet, atlas: walk_up-atlas }
    walk_northeast: { sheet: walk_northeast-spritesheet, atlas: walk_northeast-atlas }
    walk_northwest: { flip_of: walk_northeast }
    walk_right: { sheet: walk_right-spritesheet, atlas: walk_right-atlas }
    walk_left: { flip_of: walk_right }
    walk_southeast: { sheet: walk_southeast-spritesheet, atlas: walk_southeast-atlas, bake_scale: 0.95 }
    walk_southwest: { flip_of: walk_southeast }
    walk_down: { sheet: walk_down-spritesheet, atlas: walk_down-atlas, bake_scale: 0.96 }
    # Drawn on a 512px canvas rather than the 256px used above, so they bake at half
    # scale to keep Kam one size across every clip.
    jump_right: { sheet: jump_right-spritesheet, atlas: jump_right-atlas, bake_scale: 0.5 }
    jump_left: { flip_of: jump_right }
    celebrate_down: { sheet: celebrate_down-spritesheet, atlas: celebrate_down-atlas, bake_scale: 0.5 }
    lifting_with_the_force_right: { sheet: lifting_with_the_force_right-spritesheet, atlas: lifting_with_the_force_right-atlas, bake_scale: 0.5 }
    lifting_with_the_force_left: { flip_of: lifting_with_the_force_right }

# Combat arena swing sheet under Resources/Sprites/Combat/.
combat_sprite:
  root: Sprites/Combat
  chroma: black
  animations:
    swing: { sheet: player-combat-spritesheet, atlas: player-combat-atlas }
