# Per-screen music cues and optional still backgrounds.
screens:
  menu:
    # Same track as loading — no-op while already playing; restores after gameplay.
    music: title_menu
    background: menu_screen_bg
  loading:
    # Starts as early as possible during bootstrap (see AppSession.loadResources).
    music: title_menu
  preparing:
    # Keep title_menu while the world is prepared.
    music: none
  cutscene:
    # The movie carries its own dialogue; keep the score out of the way.
    music: silence
  settings:
    music: title_menu
  level_select:
    # Own track, so this screen crossfades away from title_menu rather than holding it.
    music: level_screen
    background: level_screen_bg
  player_select:
    music: title_menu
  player_selfie:
    music: title_menu
  you_win:
    music: victory
  win_game:
    # Campaign clear on level select after the final artifact fades in.
    music: win-game
  defeat:
    music: silence
