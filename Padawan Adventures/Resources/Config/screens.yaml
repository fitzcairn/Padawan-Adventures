# Per-screen music cues and optional still backgrounds.
version: 1
screens:
  menu:
    # Same track as loading — no-op while already playing; restores after gameplay.
    music: title_menu
    background: menu_screen_bg
  loading:
    # Starts as early as possible during bootstrap (see AppSession.loadResources).
    music: title_menu
  preparing:
    # Keep title_menu while the world is prepared.
    music: none
  settings:
    music: title_menu
  level_select:
    music: title_menu
    background: level_screen_bg
  player_select:
    music: title_menu
  player_selfie:
    music: title_menu
  you_win:
    music: win
  defeat:
    music: silence
