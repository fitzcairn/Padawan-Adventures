# Shared vocabulary for minigames (gate, pit, etc.).
#
# Per word:
#   image: optional sprite basename under Resources/Sprites/Words/ (no extension)
#   sfx:   pronunciation track basename under Resources/Audio/FX/Words/ (required)
#   graphemes: ordered units that concatenate to the word id (required)

words:
  apple:
    image: apple
    sfx: sfx_word_apple
    graphemes: [a, p, p, l, e]
  bath:
    image: bath
    sfx: sfx_word_bath
    graphemes: [b, a, t, h]
  boat:
    image: boat
    sfx: sfx_word_boat
    graphemes: [b, o, a, t]
  book:
    image: book
    sfx: sfx_word_book
    graphemes: [b, o, o, k]
  car:
    image: car
    sfx: sfx_word_car
    graphemes: [c, a, r]
  cat:
    image: cat
    sfx: sfx_word_cat
    graphemes: [c, a, t]
  cloud:
    image: cloud
    sfx: sfx_word_cloud
    graphemes: [c, l, o, u, d]
  dance:
    image: dance
    sfx: sfx_word_dance
    graphemes: [d, a, n, c, e]
  dog:
    image: dog
    sfx: sfx_word_dog
    graphemes: [d, o, g]
  gate:
    sfx: sfx_word_gate
    graphemes: [g, a, t, e]
  house:
