# Floor terrain catalog — single-frame tiles from floor-spritesheet (2048×2048, 11×11).
# Sheet PNG + atlas JSON under Resources/Sprites/Floor/.

version: 1

sprite:
  root: Sprites/Floor
  sheet: floor-spritesheet
  atlas_root: Sprites/Floor
  atlas: atlas
  # Near-white sheet background (often #FEFEFE); key pure white with a soft feather
  # band, then smooth the alpha matte so fringe doesn't leave a white halo.
  chroma_key: "#FFFFFF"
  chroma_key_tolerance: 18
  chroma_key_feather: 48
  chroma_key_smooth: 2

palettes:
  desert:
    accents: [boulder-red, boulder, boulder-wide, boulder-gray, rocks-small, rocks-pile, rocks-scatter, rocks-gray, rocks-dark, rocks-mixed]
    specials: [canyon, canyon-mesa, canyon-ridge, meteorite, meteorite-cracked]
  dirt:
    accents: [rocks-small, rocks-pile, rocks-scatter, rocks-gray, rocks-dark, rocks-mixed, stump, stump-mossy, stump-carved, stump-small]
    specials: []
  dirt_volcanic:
    accents: [rock-volcanic, rock-lava, ember-spark, rocks-dark, stump, stump-mossy, stump-carved, stump-small]
    specials: []
  grassland:
    accents: [flora-teal, flora-sparse, flora-odd, flowers, flowers-green, flowers-yellow, log, log-mossy, stump, stump-mossy, stump-carved, stump-small, rocks-small, rocks-pile, rocks-scatter, rocks-gray, rocks-dark, rocks-mixed]
    specials: [foliage, foliage-lush, foliage-dark, mushroom, mushroom-blue, mushroom-glow, flora-mixed]
  industrial:
    accents: [sparkle, sparkle-soft, ember-spark]
    specials: []
  swamp:
    accents: [log, log-mossy, stump, stump-mossy, stump-carved, stump-small, flora-teal, flora-sparse, flora-odd]
    specials: [swamp-roots]
  water:
    accents: [sparkle, sparkle-soft, whirlpool]
    specials: []
  ice_water:
    accents: [ice-block, sparkle, sparkle-soft]
    specials: [ice-cave, ice-arch, ice-shard, ice-crystal, ice-spire, ice-ridge, iceberg, iceberg-tall, iceberg-wide, glacier, glacier-wall]
  empty:
    accents: []
    specials: []

terrains:
  # Sandy desert dune
  sand:          { row: 0, col: 0, palette: desert }
  # Soft sand dune
  sand-dune:     { row: 0, col: 1, palette: desert }
  # Rippled sand
  sand-ripple:   { row: 0, col: 2, palette: desert }
  # Flat desert sand
  sand-flat:     { row: 0, col: 3, palette: desert }
  # Warm sand tile
  sand-warm:     { row: 0, col: 4, palette: desert }
  # Smooth sand
  sand-smooth:   { row: 0, col: 5, palette: desert }
  # Drifting sand
  sand-drift:    { row: 0, col: 6, palette: desert }
  # Shadowed sand
  sand-shadow:   { row: 0, col: 7, palette: desert }
  # Soft pale sand
  sand-soft:     { row: 0, col: 8, palette: desert }
  # Pale desert sand
  sand-pale:     { row: 0, col: 9, palette: desert }
  # Dusty sand
  sand-dusty:    { row: 0, col: 10, palette: desert }

  # Arid brown dirt
  dirt-arid:     { row: 1, col: 0, palette: dirt }
  # Dry packed dirt
  dirt-dry:      { row: 1, col: 1, palette: dirt }
  # Cracked dry earth
  dirt-cracked:  { row: 1, col: 2, palette: dirt }
  # Hard arid dirt
  dirt-hard:     { row: 1, col: 3, palette: dirt }
  # Barren dry dirt
  dirt-barren:   { row: 1, col: 4, palette: dirt }
  # Rough arid dirt
  dirt-rough:    { row: 1, col: 5, palette: dirt }
  # Dark dry dirt
  dirt-dark:     { row: 1, col: 6, palette: dirt_volcanic }
  # Scorched dry dirt
  dirt-scorched: { row: 1, col: 7, palette: dirt_volcanic }
  # Dirt with sparse weeds
  dirt-weed:     { row: 1, col: 8, palette: dirt }
  # Dirt with tiny sprouts
  dirt-sprout:   { row: 1, col: 9, palette: dirt }
  # Patchy arid dirt
  dirt-patchy:   { row: 1, col: 10, palette: dirt }

  # Green grass tile
  grass:         { row: 2, col: 0, palette: grassland }
  # Lush green grass
  grass-lush:    { row: 2, col: 1, palette: grassland }
  # Thick meadow grass
  grass-thick:   { row: 2, col: 2, palette: grassland }
  # Wooden plank floor
  plank:         { row: 2, col: 3, palette: grassland }
