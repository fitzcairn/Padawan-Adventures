# UI copy for every screen, keyed by string id.
# Per string:
#   text:    copy shown on screen (required). {braces} mark runtime substitutions.
#   sfx:     voice-over basename under Resources/Audio/FX/UI/ (required, sfx_ui_<id>)
#   context: where it appears, <= 10 words (required; shown by Tools/Record)
#   spoken:  brace-free form to record when text has substitutions (optional)
# Rebuild to pick up changes.
strings:
  button_back:
    text: "Back"
    sfx: sfx_ui_button_back
    context: "Shared back button on several screens"
  button_cancel:
    text: "Cancel"
    sfx: sfx_ui_button_cancel
    context: "Shared cancel button in alerts"
  button_ok:
    text: "OK"
    sfx: sfx_ui_button_ok
    context: "Shared confirm button in alerts"
  button_delete:
    text: "Delete"
    sfx: sfx_ui_button_delete
    context: "Destructive delete confirmation button"
  button_new:
    text: "New"
    sfx: sfx_ui_button_new
    context: "Create-player button on player select"
  loading_loading:
    text: "Loading..."
    sfx: sfx_ui_loading_loading
    context: "Loading screen status while bootstrapping"
  loading_tap_to_start:
    text: "Tap to start"
    sfx: sfx_ui_loading_tap_to_start
    context: "Loading screen status when ready"
  preparing_takeoff:
