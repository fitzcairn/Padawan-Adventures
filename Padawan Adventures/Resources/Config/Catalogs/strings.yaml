# UI copy for every screen, keyed by string id.
# Per string:
#   text:    copy shown on screen (required). {braces} mark runtime substitutions.
#   sfx:     voice-over basename under Resources/Audio/FX/UI/ (required with
#            spoken; omit when the string is never spoken).
#   context: where it appears in the UI (required; shown by Tools/Record).
#            Name the screen, the control, and whether it is on-screen, in a
#            modal, VoiceOver-only, or voice-over-only.
#   spoken:  brace-free line to record. Required when the string is in a modal
#            or is not shown as on-screen copy (VoiceOver / voice-over only).
#            Omit for buttons and for copy on the main menu, Player Select,
#            Dad Mode password, and Settings controls — they are never spoken.
#            Optional otherwise; defaults to text. Prefer sentence case.
# Rebuild to pick up changes.
strings:
  button_back:
    text: "Back"
    context: "Labeled Back button on Settings and the preparing-screen load-error. Also the VoiceOver name of the chevron icon on Level Select (icon has no visible caption)."
  button_cancel:
    text: "Cancel"
    context: "Cancel in Player Select system alerts, the Dad Mode password screen, and the main-menu New Game confirm modal. Also VoiceOver for the merchant replace-slot X button (icon only)."
  button_ok:
    text: "OK"
    context: "OK in the Player Select new-player and name-taken system alerts. Also VoiceOver for the merchant replace-slot checkmark (icon only)."
  button_delete:
    text: "Delete"
    context: "Destructive Delete in the Player Select delete-player system alert. Also VoiceOver for each row's trash icon (icon has no visible caption)."
  button_new:
    text: "New"
    context: "Labeled New button at the bottom of Player Select; opens the new-player name alert."
  loading_loading:
    text: "Loading..."
    context: "Status line on the boot Loading screen while configs and assets load, above the progress bar."
  loading_tap_to_start:
    text: "Tap to start"
    sfx: sfx_ui_loading_tap_to_start
    context: "Status line on the boot Loading screen once loading finishes; also spoken a few seconds after the screen is ready."
    spoken: "Tap to start"
  preparing_takeoff:
    text: "PREPARING FOR TAKEOFF..."
    context: "Status line on the Preparing screen while the selected planet's world is generated, above the progress bar."
  preparing_error:
    text: "Oops!  Problem there was.  Select a new level, you must."
    context: "Status line on the Preparing screen when launch fails, above the Back button."
  menu_welcome:
    text: "Welcome"
    context: "Greeting under the logo on the main menu when no player is selected yet."
  menu_welcome_named:
    text: "Welcome, {name}"
    context: "Greeting under the logo on the main menu beside the current player's avatar."
  menu_continue:
    text: "CONTINUE"
    context: "Main-menu Continue button, shown only when there is a mid-run save or campaign progress to resume."
  menu_new_game:
    text: "NEW GAME"
    context: "Main-menu New Game button. Starts immediately if there is no progress; otherwise opens the restart confirm modal."
  menu_new_game_confirm:
    text: "This will restart your game!  Are you sure?"
    sfx: sfx_ui_menu_new_game_confirm
    context: "Title of the main-menu New Game confirmation modal; Let's go / Cancel sit below. Spoken when the modal appears."
    spoken: "This will restart your game!  Are you sure?"
  menu_settings:
    text: "SETTINGS"
    context: "Main-menu Settings button; opens the Settings screen."
  menu_quit:
    text: "EXIT"
    context: "Main-menu Exit button; quits the app."
  cutscene_tap_to_skip:
    text: "Tap to skip"
    context: "Hint along the bottom of the post-New-Game cutscene movie. Tapping anywhere skips to Level Select."
  player_select_title:
    text: "Select Player"
    context: "Title at the top of Player Select."
  player_select_empty:
    text: "No players yet. Tap New to create one."
    context: "Placeholder in the Player Select list when no saved players exist, above the New button."
  player_new_title:
    text: "New Player"
    context: "Title of the Player Select new-player system alert (name field, Cancel, OK)."
  player_new_message:
    text: "Enter a unique player name."
    context: "Message body of the Player Select new-player system alert, under the title and above the name field."
  player_name_placeholder:
    text: "Player name"
    context: "Placeholder inside the name text field of the Player Select new-player system alert. Not a standalone label."
  player_delete_title:
    text: "Delete Player"
    context: "Title of the Player Select delete-player system alert (Cancel / Delete)."
  player_delete_message:
    text: "Delete \"{name}\" and all saved progress? This cannot be undone."
    context: "Message body of the Player Select delete-player system alert. The on-screen line names the player."
  player_name_taken_title:
    text: "Name Already Taken"
    context: "Title of the Player Select duplicate-name system alert after Create fails because the name exists."
  player_name_taken_message:
    text: "Player names must be unique. Choose a different name."
    context: "Message body of the Player Select duplicate-name system alert. OK returns to the new-player alert."
  player_default_name:
    text: "Padawan"
    context: "Not shown on its own. Fallback name substituted into the selfie title when the current player has no stored name."
  selfie_title:
    text: "Smile, {name}!"
    sfx: sfx_ui_selfie_title
    context: "Title at the top of the new-player selfie / camera screen. Tapping it plays this clip (one recording for every name)."
    spoken: "Smile, Padawan!"
  selfie_capture:
    text: "Click!"
    context: "Labeled capture button at the bottom of the selfie screen; takes the avatar photo."
  selfie_camera_unavailable:
    text: "Camera unavailable"
    context: "Error line on the selfie screen under the preview when the front camera cannot start."
  settings_title:
    text: "Settings"
    sfx: sfx_ui_settings_title
    context: "Title at the top of the Settings screen. Tapping it plays this clip."
    spoken: "Settings"
  settings_sound_effects:
    text: "Sound Effects"
    context: "Row label to the left of the Sound Effects volume slider on Settings."
  settings_music:
    text: "Music"
    context: "Checkbox label to the left of the Music volume slider on Settings."
  level_select_dad_mode:
    text: "Dad mode"
    context: "VoiceOver-only name of the lock icon at the bottom-right of Level Select. Not shown as on-screen text; opens the Dad Mode password screen."
  level_select_inventory:
    text: "Inventory"
    context: "VoiceOver-only name of the artifact rack along the bottom of Level Select. Not shown as on-screen text."
  level_locked:
    text: "Complete the current level first!"
    sfx: sfx_ui_level_locked
    context: "Title of the Level Select locked-planet message modal, shown when tapping a planet that is still locked. Spoken when the modal appears."
    spoken: "Complete the current level first!"
  dad_mode_unlocked:
    text: "Dad mode unlocked!"
    sfx: sfx_ui_dad_mode_unlocked
    context: "Title of the Level Select success modal after entering the correct Dad Mode password. Spoken when the modal appears."
    spoken: "Dad mode unlocked!"
  level_tython:
    text: "Tython"
    sfx: sfx_ui_level_tython
    context: "Title of the Tython level-detail modal, and the line spoken when first tapping that planet. Also VoiceOver for the planet and its inventory artifact; the strip itself has no printed name."
    spoken: "Tython"
  level_tatooine:
    text: "Tatooine"
    sfx: sfx_ui_level_tatooine
    context: "Title of the Tatooine level-detail modal, and the line spoken when first tapping that planet. Also VoiceOver for the planet and its inventory artifact; the strip itself has no printed name."
    spoken: "Tatooine"
  level_ilum:
    text: "Ilum"
    sfx: sfx_ui_level_ilum
    context: "Title of the Ilum level-detail modal, and the line spoken when first tapping that planet. Also VoiceOver for the planet and its inventory artifact; the strip itself has no printed name."
    spoken: "Ilum"
  level_kashyyyk:
    text: "Kashyyyk"
    sfx: sfx_ui_level_kashyyyk
    context: "Title of the Kashyyyk level-detail modal, and the line spoken when first tapping that planet. Also VoiceOver for the planet and its inventory artifact; the strip itself has no printed name."
    spoken: "Kashyyyk"
  level_dagobah:
    text: "Dagobah"
    sfx: sfx_ui_level_dagobah
    context: "Title of the Dagobah level-detail modal, and the line spoken when first tapping that planet. Also VoiceOver for the planet and its inventory artifact; the strip itself has no printed name."
    spoken: "Dagobah"
  level_coruscant:
    text: "Coruscant"
    sfx: sfx_ui_level_coruscant
    context: "Title of the Coruscant level-detail modal, and the line spoken when first tapping that planet. Also VoiceOver for the planet and its inventory artifact; the strip itself has no printed name."
    spoken: "Coruscant"
  level_mustafar:
    text: "Mustafar"
    sfx: sfx_ui_level_mustafar
    context: "Title of the Mustafar level-detail modal, and the line spoken when first tapping that planet. Also VoiceOver for the planet and its inventory artifact; the strip itself has no printed name."
    spoken: "Mustafar"
  level_geonosis:
    text: "Geonosis"
    sfx: sfx_ui_level_geonosis
    context: "Title of the Geonosis level-detail modal, and the line spoken when first tapping that planet. Also VoiceOver for the planet and its inventory artifact; the strip itself has no printed name."
    spoken: "Geonosis"
  level_default:
    text: "Level"
    context: "Fallback planet name from level defaults if a level omits its own name. Would appear as the level-detail modal title."
  planet_high_score:
    text: "High Score: {stars}"
    context: "Chip above a completed planet on the Level Select strip, followed by a coin icon. Also folded into that planet's VoiceOver label."
  level_detail_replay_prompt:
    text: "Highest score:"
    sfx: sfx_ui_level_detail_replay_prompt
    context: "Prompt in the Level Select replay modal, to the left of the best-coin count. Spoken when that modal opens."
    spoken: "Highest score"
  level_detail_continue_prompt:
    text: "Continue your adventure on {planet}?"
    sfx: sfx_ui_level_detail_continue_prompt
    context: "Prompt in the Level Select continue-adventure modal under the planet name. Spoken when that modal opens (one recording for every planet)."
    spoken: "Continue your adventure on this planet?"
  level_detail_start_over:
    text: "Start over!"
    context: "Secondary button in the Level Select continue-adventure modal; starts the planet from scratch instead of resuming the save."
  level_detail_take_off:
    text: "Let's go!"
    context: "Primary confirm in the Level Select first-start and continue-adventure modals. Reused as the confirm button on the main-menu New Game restart modal."
  level_detail_not_ready:
    text: "Not yet."
    context: "Dismiss button in the Level Select first-start modal; closes the modal without launching the planet."
  level_detail_try_again:
    text: "Let's go!"
    context: "Primary confirm in the Level Select replay modal; launches a fresh run of an already-completed planet."
  level_detail_no_thanks:
    text: "Not yet."
    context: "Dismiss button in the Level Select replay modal; closes the modal without launching."
  dad_mode_enter_password:
    text: "Enter password"
    context: "Title at the top of the Dad Mode password screen, above the four digit slots and keypad."
  dad_mode_incorrect:
    text: "Incorrect"
    context: "Red feedback under the digit slots on the Dad Mode password screen after a wrong four-digit code."
  you_win:
    text: "You win!"
    sfx: sfx_ui_you_win
    context: "Title of the planet-complete You Win modal, above the coin count. Spoken when the modal appears."
    spoken: "You win!"
  you_win_high_score:
    text: "New high score!"
    sfx: sfx_ui_you_win_high_score
    context: "Extra line at the bottom of the You Win modal when this run beats the planet's previous best. Tappable to replay the clip."
    spoken: "New high score!"
  campaign_win_congratulations:
    text: "Congratulations!"
    sfx: sfx_ui_campaign_win_congratulations
    context: "Title of the campaign-complete overlay on Level Select after the last planet. Spoken when that overlay appears."
    spoken: "Congratulations!"
  campaign_win_tap_to_play_more:
    text: "tap to play more"
    context: "Hint along the bottom of the campaign-complete overlay on Level Select. Tapping the overlay dismisses it."
  minigame_coins_won:
    text: "You won {coins} coins!"
    sfx: sfx_ui_minigame_coins_won
    context: "Title of the minigame / combat win modal above the coin row. Spoken when the modal appears (one recording for every coin count)."
    spoken: "You won some coins!"
  minigame_tutorial_sound_out_word_pit:
    text: "Tutorial goes here"
    sfx: sfx_ui_minigame_tutorial_sound_out_word_pit
    context: "Voice-over only on the first sound-out-word pit tutorial. The demo plays behind a tap-catcher; this line is not shown on screen."
    spoken: "Tutorial goes here"
  minigame_tutorial_ending_sound_pit:
    text: "Tutorial goes here"
    sfx: sfx_ui_minigame_tutorial_ending_sound_pit
    context: "Voice-over only on the first ending-sound pit tutorial. The demo plays behind a tap-catcher; this line is not shown on screen."
    spoken: "Tutorial goes here"
  minigame_tutorial_starting_sound_pit:
    text: "Tutorial goes here"
    sfx: sfx_ui_minigame_tutorial_starting_sound_pit
    context: "Voice-over only on the first starting-sound pit tutorial. The demo plays behind a tap-catcher; this line is not shown on screen."
    spoken: "Tutorial goes here"
  minigame_tutorial_sound_out_word_gate:
    text: "Tutorial goes here"
    sfx: sfx_ui_minigame_tutorial_sound_out_word_gate
    context: "Voice-over only on the first sound-out-word gate tutorial. The demo plays behind a tap-catcher; this line is not shown on screen."
    spoken: "Tutorial goes here"
  minigame_tutorial_grapheme_sound_gate:
    text: "Tutorial goes here"
    sfx: sfx_ui_minigame_tutorial_grapheme_sound_gate
    context: "Voice-over only on the first grapheme-sound gate tutorial. The demo plays behind a tap-catcher; this line is not shown on screen."
    spoken: "Tutorial goes here"
  minigame_tutorial_starting_sound_gate:
    text: "Tutorial goes here"
    sfx: sfx_ui_minigame_tutorial_starting_sound_gate
    context: "Voice-over only on the first starting-sound gate tutorial. The demo plays behind a tap-catcher; this line is not shown on screen."
    spoken: "Tutorial goes here"
  minigame_tutorial_ending_sound_gate:
    text: "Tutorial goes here"
    sfx: sfx_ui_minigame_tutorial_ending_sound_gate
    context: "Voice-over only on the first ending-sound gate tutorial. The demo plays behind a tap-catcher; this line is not shown on screen."
    spoken: "Tutorial goes here"
  minigame_tutorial_grapheme_sound_combat:
    text: "The monster throws letters at you. Slash the letter you hear to send it back. A wrong letter flashes and fades — keep going until you find the right one."
    sfx: sfx_ui_minigame_tutorial_grapheme_sound_combat
    context: "Voice-over only on the first grapheme-sound combat tutorial. The demo plays behind a tap-catcher; this line is not shown on screen."
    spoken: "The monster throws letters at you. Slash the letter you hear to send it back. A wrong letter flashes and fades — keep going until you find the right one."
  minigame_tutorial_starting_sound_combat:
    text: "The monster throws a word with its first sound missing. Tap the word to hear it, then tap the circle with the missing sound to send it back. A wrong circle mixes the rings up — keep looking until you find the right one."
    sfx: sfx_ui_minigame_tutorial_starting_sound_combat
    context: "Voice-over only on the first starting-sound combat tutorial. The demo plays behind a tap-catcher; this line is not shown on screen."
    spoken: "The monster throws a word with its first sound missing. Tap the word to hear it, then tap the circle with the missing sound to send it back. A wrong circle mixes the rings up — keep looking until you find the right one."
  minigame_tutorial_ending_sound_combat:
    text: "The monster throws a word with its last sound missing. Tap the word to hear it, then tap the circle with the missing sound to send it back. A wrong circle mixes the rings up — keep looking until you find the right one."
    sfx: sfx_ui_minigame_tutorial_ending_sound_combat
    context: "Voice-over only on the first ending-sound combat tutorial. The demo plays behind a tap-catcher; this line is not shown on screen."
    spoken: "The monster throws a word with its last sound missing. Tap the word to hear it, then tap the circle with the missing sound to send it back. A wrong circle mixes the rings up — keep looking until you find the right one."
  minigame_tutorial_continue:
    text: "Tap to continue"
    sfx: sfx_ui_minigame_tutorial_continue
    context: "Hint along the bottom of every first-encounter minigame tutorial. Also spoken once each time the demo animation finishes."
    spoken: "Tap to continue"
  defeated:
    text: "Defeated"
    sfx: sfx_ui_defeated
    context: "Title of the world / combat defeat modal. Spoken when the modal appears."
    spoken: "Defeated"
  hud_flee:
    text: "Flee the planet!"
    context: "VoiceOver-only name of the run-icon flee button on the world HUD. Not shown as on-screen text."
  hud_leave:
    text: "Leave"
    context: "VoiceOver-only name of the run-icon leave button during minigames and combat. Not shown as on-screen text."
  control_checked:
    text: "checked"
    context: "VoiceOver-only value of the Settings Music checkbox when it is on. Not shown as on-screen text."
  control_unchecked:
    text: "unchecked"
    context: "VoiceOver-only value of the Settings Music checkbox when it is off. Not shown as on-screen text."
  control_percent:
    text: "{percent} percent"
    context: "VoiceOver-only value of the Settings volume sliders and the loading / preparing progress bars. Not shown as on-screen text."
  world_tutorial_intro:
    text: "Tap where you want to go. Drag to look around."
    sfx: sfx_ui_world_tutorial_intro
    context: "Voice-over only at the start of Tython's first-visit world tutorial. The hand cursor and Tap to continue hint are visible; this line is not shown on screen."
    spoken: "Tap where you want to go. Drag to look around."
  world_tutorial_tap_to_continue:
    text: "Tap to continue"
    context: "Hint along the bottom of the world during Tython's first-visit tap-and-drag tutorial."
  merchant_item_bridge:
    text: "Use the bridge to remove a pit!"
    sfx: sfx_ui_merchant_item_bridge
    context: "Description in the merchant inspect modal for the bridge ware. Spoken when that modal appears."
    spoken: "This is a bridge, it looks great"
  merchant_item_crystal_green:
    text: "A green kyber crystal!"
    sfx: sfx_ui_merchant_item_crystal_green
    context: "Description in the merchant inspect modal for the green crystal ware. Spoken when that modal appears."
    spoken: "This is a green crystal, it looks great"
  merchant_item_crystal_purple:
    text: "A purple kyber crystal!"
    sfx: sfx_ui_merchant_item_crystal_purple
    context: "Description in the merchant inspect modal for the purple crystal ware. Spoken when that modal appears."
    spoken: "This is a purple crystal, it looks great"
  merchant_item_crystal_yellow:
    text: "A yellow kyber crystal!"
    sfx: sfx_ui_merchant_item_crystal_yellow
    context: "Description in the merchant inspect modal for the yellow crystal ware. Spoken when that modal appears."
    spoken: "This is a yellow crystal, it looks great"
  merchant_item_double_saber:
    text: "A double lightsaber.  Careful!"
    sfx: sfx_ui_merchant_item_double_saber
    context: "Description in the merchant inspect modal for the double-saber ware. Spoken when that modal appears."
    spoken: "This is a double saber, it looks great"
  merchant_item_jetpack:
    text: "Use the jetback to jump over any gate!"
    sfx: sfx_ui_merchant_item_jetpack
    context: "Description in the merchant inspect modal for the jetpack ware. Spoken when that modal appears."
    spoken: "This is a jetpack, it looks great"
  merchant_item_satelite:
    text: "Use the satelite to locate the lightsaber piece!"
    sfx: sfx_ui_merchant_item_satelite
    context: "Description in the merchant inspect modal for the satelite ware. Spoken when that modal appears."
    spoken: "This is a satelite, it looks great"
  merchant_item_scanner:
    text: "Use the scanner to look around you!"
    sfx: sfx_ui_merchant_item_scanner
    context: "Description in the merchant inspect modal for the scanner ware. Spoken when that modal appears."
    spoken: "This is a scanner, it looks great"
  merchant_item_vector:
    text: "Call Yoda's Jedi Vector to blast through enemies!"
    sfx: sfx_ui_merchant_item_vector
    context: "Description in the merchant inspect modal for the vector ware. Spoken when that modal appears."
    spoken: "This is a vector, it looks great"
  merchant_replace_item:
    text: "Replace item?"
    sfx: sfx_ui_merchant_replace_item
    context: "Title of the merchant modal when dropping a ware onto an occupied inventory slot (X to cancel, check to replace). Spoken when the modal appears."
    spoken: "Replace item?"
  merchant_coins_spent:
    text: "You spent {coins} coins!"
    sfx: sfx_ui_merchant_coins_spent
    context: "Voice-over only during the merchant purchase coin-burst. The burst is visual; this line is not shown on screen."
    spoken: "You spent some coins!"
  inventory_jetpack_need_gate:
    text: "Get closer to a gate to use the jetpack!"
    sfx: sfx_ui_inventory_jetpack_need_gate
    context: "CRT modal over the live world when the player taps the jetpack in the HUD but is not uniquely close enough to a gate to jump. Spoken when the modal appears. Tap anywhere dismisses."
    spoken: "Get closer to a gate to use the jetpack!"
  inventory_bridge_need_pit:
    text: "Get closer to the pit you want to bridge"
    sfx: sfx_ui_inventory_bridge_need_pit
    context: "CRT modal over the live world when the player taps the bridge in the HUD but is not uniquely close enough to one pit blob to fill. Spoken when the modal appears. Tap anywhere dismisses."
    spoken: "Get closer to the pit you want to bridge"
