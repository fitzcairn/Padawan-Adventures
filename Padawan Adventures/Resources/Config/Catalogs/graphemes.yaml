# Shared grapheme FX for minigames (gate grapheme-match, gate sound-out-word, combat cues, etc.).
# Every grapheme here is a single letter, so its tracks are the letter clips under
# Resources/Audio/FX/Letters/. Multi-letter graphemes (sh, ch, …) get their own
# sfx_grapheme_* tracks under Resources/Audio/FX/Graphemes/.
#
# Per entry:
#   sfx:  pronunciation track basename (required)
#   name: grapheme-name track basename (required)

graphemes:
  a:
    sfx: sfx_letter_a_pronunciation
    name: sfx_letter_a_name
  b:
