defaults:
  letter: E
  color: "#FF0000"
  tiles_per_second: 0.7
  forget_seconds: 3.0
  combat_timer_seconds: 30
  shot_travel_seconds: 8
  stars_to_win: 5
  shot_letters: [a, b, c]
  fx:
    contact: sfx_enemy_contact

# Each type inherits everything from `defaults:`; any same-name key here wins.
enemies:
  centipede:   { sprite: centipede }
  dino:        { sprite: dino }
  drone:       { sprite: drone }
  ice_monster: { sprite: ice_monster }
  lava_lizard: { sprite: lava_lizard }
  moth:        { sprite: moth }
