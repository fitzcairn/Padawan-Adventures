# Enemy type definitions. Level YAML spawn config references keys under `enemies:`.
# Empty entries inherit `defaults:`. `shot_letters` resolve through Catalogs/letters.yaml:
# each id's uppercased form becomes the shotTypes key, and that letter's `name` track
# becomes the shoot FX (e.g. a → shotTypes["A"].fx.shoot == sfx_letter_a_name).

version: 1
slash_max_seconds: 0.5

defaults:
  letter: E
  color: "#FF0000"
  tiles_per_second: 0.5
  forget_seconds: 3.0
  combat_timer_seconds: 30
  shot_travel_seconds: 8
  stars_to_win: 5
  shot_letters: [a, b, c]
  fx:
    contact: sfx_enemy_contact

enemies:
  horranth:
  krayt_dragon:
  tusken_raider:
  ice_spider:
  katarn:
  kinrath:
  dragonsnake:
  security_droid:
  armored_rat:
  lava_flea:
  geonosian:
  battle_droid:
