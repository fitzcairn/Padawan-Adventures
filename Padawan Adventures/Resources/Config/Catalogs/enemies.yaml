# Enemy type definitions. Level YAML spawn config references keys under `enemies:`.
# Empty entries inherit `defaults:`. `shot_letters` resolve through Catalogs/letters.yaml:
# each id's uppercased form becomes the shotTypes key, and that letter's `name` track
# becomes the shoot FX (e.g. a → shotTypes["A"].fx.shoot == sfx_letter_a_name).

version: 1
slash_max_seconds: 0.5

# Shared enemy sprite sheets, referenced by id from each type's `sprite:`.
# Sheets already carry an alpha channel, so no `chroma:` / `chroma_key:`.
# Atlas rects share one crop per enemy, so `trim: false` keeps the sprite from
# changing size between facings and between idle/walk.
# `scale` is proportional to the source art (0.60 x cropHeight / 105) so relative
# creature sizes survive height normalization. Display height = wall_height x scale.
# Mirrored facings use flip_of (same pattern as player.yaml) so left/NW/SW sheets
# are not loaded — PNGs may remain on disk unused.
sprites:
  centipede:
    root: Enemies/Centipede
    trim: false
    scale: 0.86
    anchor_correction: 0
    animations:
      idle_up: { sheet: centipede-idle_up-spritesheet, atlas: centipede-idle_up-atlas }
      idle_northeast: { sheet: centipede-idle_northeast-spritesheet, atlas: centipede-idle_northeast-atlas }
      idle_northwest: { flip_of: idle_northeast }
      idle_right: { sheet: centipede-idle_right-spritesheet, atlas: centipede-idle_right-atlas }
      idle_left: { flip_of: idle_right }
      idle_southeast: { sheet: centipede-idle_southeast-spritesheet, atlas: centipede-idle_southeast-atlas }
      idle_southwest: { flip_of: idle_southeast }
      idle_down: { sheet: centipede-idle_down-spritesheet, atlas: centipede-idle_down-atlas }
      walk_up: { sheet: centipede-walk_up-spritesheet, atlas: centipede-walk_up-atlas }
      walk_northeast: { sheet: centipede-walk_northeast-spritesheet, atlas: centipede-walk_northeast-atlas }
      walk_northwest: { flip_of: walk_northeast }
      walk_right: { sheet: centipede-walk_right-spritesheet, atlas: centipede-walk_right-atlas }
      walk_left: { flip_of: walk_right }
      walk_southeast: { sheet: centipede-walk_southeast-spritesheet, atlas: centipede-walk_southeast-atlas }
      walk_southwest: { flip_of: walk_southeast }
      walk_down: { sheet: centipede-walk_down-spritesheet, atlas: centipede-walk_down-atlas }
