# Item sprite definitions. Top-level keys match pickup ids in level YAML (`pickups:`).

energy:
  sprite:
    root: Sprites/Items/Energy
    chroma: black
    scale: 0.6
    animations:
      idle:
        sheet: energy-spritesheet
        atlas: energy-atlas

health:
  sprite:
    root: Sprites/Items/Health
    chroma: black
    scale: 0.4
    animations:
      idle:
        sheet: health-spritesheet
        atlas: health-atlas

# Treasure: lightsaber parts, one per level (see each level's `treasure:` key).
# Sheets already carry alpha, so no chroma key.
# Optional `highlight:` draws a particle halo behind the sprite (any item id can opt in).
emitter:
  sprite:
    root: Sprites/Items/Treasure/1-emitter
    scale: 1.0
    animations:
      idle:
        sheet: 1-emitter-spritesheet
        atlas: 1-emitter-atlas
  highlight:
    color: "#FFD54F"
    birth_rate: 22
    lifetime: 1.1
    radius: 0.45
    particle_size: 0.12
    alpha: 0.85
    y_offset: 0.45

