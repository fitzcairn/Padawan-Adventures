# Merchant shop wares (not world pickups). `description` is a strings.yaml id.
# `min_level` is a level `order:` (Tython = 1). Shown price = `price` × current order.
# `limit:` max copies of this ware in inventory (`0` = unlimited).
# Still sheets use near-black (#010101), so `chroma: black_soft` (tolerance 2).
merchant:
  merchant-ware-bridge:
    min_level: 2
    price: 10
    limit: 1
    description: merchant_item_bridge
    sprite:
      root: Sprites/Items/Merchant
      chroma: black_soft
      height_fraction: 0.5
