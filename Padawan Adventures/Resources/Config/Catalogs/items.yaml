# Item sprite definitions. Top-level keys match pickup ids in level YAML (`pickups:`).
# `sprite.scale` is display height as a fraction of app.yaml `display.wall_height`
# (defaults to max(tile_width, tile_height) when omitted). Rebuild to pick up changes.

energy:
  sprite:
    root: Sprites/Items/Energy
    chroma: black
    scale: 0.6
    animations:
      idle:
        sheet: energy-spritesheet
        atlas: energy-atlas

health:
  sprite:
    root: Sprites/Items/Health
    chroma: black
    scale: 0.4
    animations:
      idle:
        sheet: health-spritesheet
        atlas: health-atlas

# Score / currency icon (HUD, level select, puzzle win overlays). Not a world pickup.
# Exterior black already flood-filled to alpha; no chroma key.
coin:
  sprite:
    root: Sprites/Items/Coins
    bake_scale: 0.25
    scale: 0.45
    animations:
      idle:
        sheet: coin
        atlas: coin-atlas

# Treasure: lightsaber parts, one per level (see each level's `treasure:` key).
# Sheets already carry alpha, so no chroma key.
# Optional `highlight:` draws a particle halo behind the sprite (any item id can opt in).
emitter:
  sprite:
    root: Levels/1-tython
    scale: 1.0
    animations:
      idle:
        sheet: 1-emitter-spritesheet
        atlas: 1-emitter-atlas
  highlight: treasure_gold

