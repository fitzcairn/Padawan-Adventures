# Padawan Adventures — enemy type definitions
# Each key under `types` is a named enemy kind referenced by world.yaml.

types:
  grunt:
    letter: E
    color: "#FF0000"
    tiles_per_second: 0.5
    forget_seconds: 3.0
    combat_timer_seconds: 30
    shot_travel_seconds: 8
    stars_to_win: 5
    # Shot letters; cue SFX use shared letter-name tracks (sfx_letter_*_name).
    shot_types:
      A:
        fx: sfx_letter_a_name
      B:
        fx: sfx_letter_b_name
      C:
        fx: sfx_letter_c_name
    fx:
      contact: sfx_enemy_contact
