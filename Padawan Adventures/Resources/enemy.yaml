# Padawan Adventures — enemy type definitions
# Each key under `types` is a named enemy kind referenced by world.yaml.

types:
  grunt:
    letter: E
    color: "#FF0000"
    tiles_per_second: 1.0
    forget_seconds: 3.0
    combat_timer_seconds: 30
    shot_travel_seconds: 8
    stars_to_win: 5
    shot_types:
      A:
        fx: sfx_enemy_shot_a
      B:
        fx: sfx_enemy_shot_b
      C:
        fx: sfx_enemy_shot_c
    fx:
      contact: sfx_enemy_contact
