# Padawan Adventures — enemy type definitions
# Each key under `types` is a named enemy kind referenced by world.yaml.

types:
  grunt:
    letter: E
    color: "#FF0000"
    tiles_per_second: 1.0
    forget_seconds: 3.0
    combat_timer_seconds: 10
    shot_interval_seconds: 1.2
    shot_travel_seconds: 1.5
    stars_to_win: 5
    fx:
      contact: sfx_enemy_contact
      shoot: sfx_enemy_shoot
