# Padawan Adventures — world seed (v1)
# All procedural generation is deterministic for a given seed + params.
# Use `seed: time` for a fresh seed from the clock on each new game, or a number to fix it.

version: 1
seed: time

world:
  width: 100
  height: 100
  stories: 1

display:
  tile_width: 80
  tile_height: 40

generation:
  algorithm: rooms_doors
  room_count: 100
  corridor_width: 2
  room:
    min_room_size: 4
    max_room_size: 12
    # Probability that a room contains a pit (at most one pit per room).
    pit_chance: 0.2
    wall_destructible_chance: 0.8
    door_count: 4

enemies:
  type: grunt
  spawn_chance_per_room: 0.8

pickups:
  health:
    spawn_chance_per_room: 0.8
  energy:
    spawn_chance_per_room: 0.8
  treasure:
    spawn_chance_per_room: 0.8

extensions: {}
