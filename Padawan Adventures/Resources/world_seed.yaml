# Padawan Adventures — world seed (v1)
# All procedural generation is deterministic for a given seed + params.

version: 1
seed: 42

world:
  width: 100
  height: 100
  stories: 2

display:
  tile_width: 80
  tile_height: 40

generation:
  algorithm: rooms_doors
  room_count: 100
  corridor_width: 2
  min_room_size: 4
  max_room_size: 12
  pit_chance: 0.05
  wall_destructible_chance: 0.2
  ramp_count: 2
  ladder_count: 2
  slide_count: 1
  door_count: 4

player:
  letter: P

extensions: {}
