# Level generation knobs (merged into world.yaml at load).
# Includes map size, generation, enemy spawn, pickups, and puzzle FX.
# Per-level files in Config/Levels/ inherit from this base via `inherits: _defaults`.

name: Level

# Background music track basename (Resources/Audio/Music/<name>.mp3).
# Use `none` to keep previous music, or `silence` to fade out.
music: level

# Per-minigame music for this level (same cue rules as `music:`).
game_music:
  combat: combat
  pit: pit
  gate: gate

# How often to replay the current letter-name prompt (combat cues, wall puzzle, etc.).
letter_sound_repeat_seconds: 3

width: 20
height: 20

# Per-level baked floor tile set under Resources/Sprites/Floor/{set}/.
floor:
  set: 1-tython
  decor_prob: 0.06

# Per-level baked letter glyph set under Resources/Sprites/Letters/{set}/.
letters:
  set: 1-tython

algorithm: rooms_doors
# How many rooms to place on the map.
room_count: 5
# Legacy config key (validated >= 2). Packed joins use fixed 2-tile gate strips to match gate sprites.
corridor_width: 2
room:
  min_room_size: 4
  max_room_size: 12
  # Probability that a room contains a pit (at most one pit area per room).
  pit_chance: 1.0
  # Pit area size: mean tile count, capped at max.
  pit_mean_size: 5
  pit_max_size: 10
  # Optional sealed shared-wall shortcut gates (not the mandatory join gates).
  partition_gate_chance: 0.8

# Pit spelling-hop minigame (triggered on pit tile contact).
# Stars awarded on win = number of letters in the solved word.
# `fx.lose` overrides shared `audio.yaml` when present; `jump` fires on every hop.
pit:
  timer_seconds: 30
  num_padding_letters: 6
  words: [cat, dog, star]
  # `lose` overrides the shared audio.yaml table; `jump` fires on every hop.
  fx: { lose: pit-falling, jump: pit-jump }

# Gate minigames (triggered on gate tile contact — spelling or letter-match picked at random).
# Host `fx.opened` plays in the world when the gate strip opens.
gate:
  fx: { opened: gate-open }
  minigames:
    - type: spelling
      timer_seconds: 30
      num_padding_letters: 6
      words: [cat, dog, star, gate, open]
      music: gate
      # Ambient arc, looped for the lifetime of the scene.
      fx: { loop: gate-spelling-loop-arc }
    - type: letter_match
      timer_seconds: 30
      letter_count_min: 4
      letter_count_max: 8
      letters: [a, b, c, d, e, f, g, h]
      music: gate
      fx: { switch_push: gate-letter_match-switch-push }

enemies:
  types: [spider]
  spawn_chance_per_room: 0.8

pickups:
  health:
    spawn_chance_per_room: 0.8
  energy:
    spawn_chance_per_room: 0.8
