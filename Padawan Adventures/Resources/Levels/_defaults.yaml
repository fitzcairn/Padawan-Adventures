# Level generation knobs (merged into world.yaml at load).
# Includes map size, generation, enemy spawn, pickups, and puzzle FX.
# Per-level files in Levels/<id>/level.yaml inherit from this base via `inherits: _defaults`.

name: Level

# Background music track basename (Resources/Audio/Music/<name>.mp3).
# Use `none` to keep previous music, or `silence` to fade out.
music: level

# Per-minigame music for this level (same cue rules as `music:`).
game_music:
  combat: combat
  pit: pit
  gate: gate

# How often to replay the current letter-name prompt (combat cues, wall puzzle, etc.).
letter_sound_repeat_seconds: 3

# Combat letter spawn frequency vs derived baseline (1.0 = default; 0.7 = 30% fewer).
combat_letter_spawn_rate: 0.7
# Combat projectile / cue letter casing: lower | upper | both.
combat_letter_case: lower

# Combat minigames (one is picked per encounter, weighted). weight 0 = never.
# `slash` is the swipe arena (knobs live in enemies.yaml + combat_letter_* above).
# `deflect`: monster throws a word image; tap the ring for that word's first letter.
# Letters map left -> right onto evenly spaced rings (2–6) and must resolve in
# phonics.yaml; each letter needs ≥1 imaged word in words.yaml.
combat:
  minigames:
    - type: slash
      weight: 0.5
    - type: deflect
      weight: 0.5
      monster_hp: 5
      orb_travel_seconds: 3.0
      letters: [a, b, c, d]

# Width and height of the level, in floor tiles.
width: 20
height: 20

# Floor decor sprinkle rate. The tile set itself is derived from the level folder
# (Levels/<id>/<id>-floor-*), so levels only set `floor.set` to borrow other art.
floor:
  decor_prob: 0.06
  # 0 = legacy per-cell variety (noisy), 1 = maximal patching (calm).
  cohesion: 0.75

algorithm: rooms_doors
# How many rooms to place on the map.
room_count: 5
room:
  # L-shaped rooms stretch one arm to 2x max_room_size, so the widest room a level
  # can produce is roughly double this (capped by width/height above).
  min_room_size: 4
  max_room_size: 6
  # Probability that a room contains a pit (at most one pit area per room).
  pit_chance: 1.0
  # Pit area size: mean tile count, capped at max.
  pit_mean_size: 5
  pit_max_size: 10
  # Optional sealed shared-wall shortcut gates (not the mandatory join gates).
  partition_gate_chance: 0.8

# Pit minigames (one is picked per pit contact, weighted). weight 0 = never.
# Host `fx` is shared: `jump` fires on every hop, `lose` / `win` override audio.yaml.
# `spelling`: hop the letter platforms to spell the word. Stars = letters in the word.
#   Its `words:` are ids that must resolve in words.yaml (each id has sfx + optional image).
# `bridge`: drag the tile whose letter is the word's end sound into the dashed slot.
#   Its `words:` are catalog ids from words.yaml (each must have an image). The prompt
#   shows that image and plays the word's sfx. Pool must hold at least `max_words`
#   entries. Stars = words placed.
pit:
  fx: { lose: pit-falling, jump: pit-jump }
  minigames:
    - type: spelling
      weight: 0.5
      num_padding_letters: 6
      words: [cat, dog, star]
    - type: bridge
      weight: 0.5
      min_words: 3
      max_words: 5
      words: [car, dog, trash, sun, star, book]

# Gate minigames (triggered on gate tile contact).
# Host `fx.opened` plays in the world when the gate strip opens.
# `minigame_chance` is P(run a puzzle); otherwise the gate opens freely with the opened SFX.
# TEMP: word_plug only, chance 1.0, so every gate exercises the new puzzle.
gate:
  fx: { opened: gate-open }
  minigame_chance: 1.0
  minigames:
    - type: word_plug
      # Words per round: 1...9. Runtime snaps to a multiple of 3 in range when one exists.
      word_count_min: 2
      word_count_max: 2
      words: [cat, dog, star, bath, dance, book, lightbulb, wand]
      music: gate
      fx: { loop: gate-spelling-loop-arc }
    - type: spelling
      num_padding_letters: 6
      words: [cat, dog, star, gate, car]
      music: gate
      fx: { loop: gate-spelling-loop-arc }
    - type: letter_match
      letter_count_min: 4
      letter_count_max: 8
      letters: [a, b, c, d, e, f, g, h]
      music: gate
      fx: { switch_push: gate-letter_match-switch-push }

enemies:
  types: [spider]
  spawn_chance_per_room: 0.8

pickups:
  health:
    spawn_chance_per_room: 0.8
  energy:
    spawn_chance_per_room: 0.8
