# Level generation knobs (merged into world.yaml at load).
# Includes map size, generation, enemy spawn, pickups, and puzzle FX.
# Per-level files in Levels/<id>/level.yaml inherit from this base via `inherits: _defaults`.
# Inheritance: dictionaries merge key by key; arrays replace wholesale.

name: Level

# Map layout, spawn rates, and exploration music.
world:
  # Background music track basename (Resources/Audio/Music/<name>.mp3).
  # Use `none` to keep previous music, or `silence` to fade out.
  music: level

  # Width and height of the level, in floor tiles.
  width_tiles: 20
  height_tiles: 20

  # How many rooms to place on the map.
  room_count: 5
  room:
    # L-shaped rooms stretch one arm to 2x max_size_tiles, so the widest room a level
    # can produce is roughly double this (capped by width/height above).
    min_size_tiles: 4
    max_size_tiles: 6
    # Probability that a room contains a pit (at most one pit area per room).
    pit_probability: 1.0
    # Pit area size: mean tile count, capped at max.
    pit_mean_size_tiles: 5
    pit_max_size_tiles: 10
    # Probability that a join edge becomes a gated strip (miss → open doorway).
    gate_probability: 0.8

  # Floor decor sprinkle rate. The tile set itself is derived from the level folder
  # (Levels/<id>/<id>-floor-*), so levels only set `floor.set` to borrow other art.
  floor:
    decor_probability: 0.06
    # 0 = legacy per-cell variety (noisy), 1 = maximal patching (calm).
    cohesion_fraction: 0.75

  enemies:
    types: [spider]
    spawn_probability_per_room: 0.8

  pickups:
    health:
      spawn_probability_per_room: 0.8
    energy:
      spawn_probability_per_room: 0.8

# Combat minigames (one is picked per encounter, weighted). weight 0 = never.
# Overriding `minigames:` replaces the whole list — restate every entry you want to keep.
# `grapheme-sound-combat`: swipe-to-slash arena cued by grapheme-name sounds. Stars = graphemes hit.
#   Letter pool and pacing come from enemies.yaml; this entry sets spawn rate, case, and
#   how often to replay the current grapheme-name prompt.
# `starting-sound-combat`: monster throws a word image; tap the ring for that word's first
#   grapheme. Its `graphemes:` map left -> right onto evenly spaced rings (2–6) and must resolve
#   in graphemes.yaml; each needs ≥1 imaged word in words.yaml that starts with it.
#   Stars = orbs deflected.
# `ending-sound-combat`: same arena, but the ring must match the word's last grapheme, so each
#   of its `graphemes:` needs ≥1 imaged word that ends with it.
combat:
  music: combat
  minigames:
    - type: grapheme-sound-combat
      weight: 0.5
      grapheme_spawn_multiplier: 0.7
      grapheme_case: lower
      # How often to replay the current grapheme-name prompt during slash combat.
      grapheme_sound_repeat_seconds: 3
    - type: starting-sound-combat
      weight: 0.5
      monster_hit_points: 5
      orb_travel_seconds: 4.0
      graphemes: [a, b, c, d]
    - type: ending-sound-combat
      weight: 0.0
      monster_hit_points: 5
      orb_travel_seconds: 4.0
      graphemes: [t, d, n, r]

# Pit minigames (one is picked per pit contact, weighted). weight 0 = never.
# Overriding `minigames:` replaces the whole list — restate every entry you want to keep.
# Host `fx.jump` fires on every hop; `win` falls back to audio.yaml.
# `sound-out-word-pit`: sound out the word one grapheme at a time. Each grapheme fades in a
#   set of blank tiles; drag Kam onto the one whose sound comes next. Stars = graphemes in the
#   word. Its `words:` are ids that must resolve in words.yaml (each must have an image and be
#   >= 2 graphemes), and every grapheme of every word must resolve in graphemes.yaml. Set size
#   is `min_choice_count`...`max_choice_count` (2...6), rolled per grapheme.
# `ending-sound-pit`: drag the tile whose letter is the word's end sound into the dashed slot.
#   Its `words:` are catalog ids from words.yaml (each must have an image). The prompt
#   shows that image and plays the word's sfx. Pool must hold at least `max_word_count`
#   entries. Stars = words placed.
# `starting-sound-pit`: same board as `ending-sound-pit`, but the tile must match the word's
#   FIRST letter (`_og` for dog). Same `words:` rules: catalog ids with images, >= 2 graphemes,
#   pool at least `max_word_count` entries. Stars = words placed.
pit:
  music: pit
  fx: { jump: pit-jump }
  minigames:
    - type: sound-out-word-pit
      weight: 1.0
      min_choice_count: 3
      max_choice_count: 3
      words: [cat, dog, sun, star]
    - type: ending-sound-pit
      weight: 0.0
      min_word_count: 3
      max_word_count: 5
      words: [car, dog, trash, sun, star, book]
    - type: starting-sound-pit
      weight: 0.0
      min_word_count: 3
      max_word_count: 5
      words: [car, dog, trash, sun, star, book]

# Gate minigames (triggered on gate tile contact).
# Overriding `minigames:` replaces the whole list — restate every entry you want to keep.
# Host `fx.opened` plays in the world when the gate strip opens.
# `minigame_probability` is P(run a puzzle); otherwise the gate opens freely with the opened SFX.
# Weights pick the kind baked onto each gate tile at generation time (weight 0 = never).
# Duplicate `type:` entries are rejected.
# `starting-sound-gate`: plug each word's missing first letter into its socket. Stars = words plugged.
#   Its `words:` are ids that must resolve in words.yaml. Plays the starting-letter pronunciation
#   when a plug is picked up. Word count snaps to a multiple of 3 in `min_word_count`...`max_word_count`.
# `ending-sound-gate`: same board as `starting-sound-gate`, but the plug must match the word's
#   LAST letter (`do_` for dog) and the socket sits to the right of the plate. Every word's last
#   grapheme must resolve in graphemes.yaml.
# `sound-out-word-gate`: sound out the prompted word one grapheme at a time. Each grapheme offers a
#   set of blank capacitors; drag the right one into the play area, left to right. Stars = graphemes
#   in the word. Its `words:` are ids that must resolve in words.yaml (each id has sfx + optional
#   image), and every grapheme of every word must resolve in graphemes.yaml. Set size is
#   `min_choice_count`...`max_choice_count` (2...6), rolled per grapheme.
# `grapheme-sound-gate`: hear a letter pronunciation and tap the matching switch. Stars = graphemes matched.
#   Its `graphemes:` are ids that must resolve in graphemes.yaml. Round size is
#   `min_grapheme_count`...`max_grapheme_count` clamped to the pool.
gate:
  music: gate
  fx: { opened: gate-open }
  minigame_probability: 1.0
  minigames:
    - type: starting-sound-gate
      weight: 0.0
      # Words per round: 1...9. Runtime snaps to a multiple of 3 in range when one exists.
      min_word_count: 2
      max_word_count: 2
      words: [cat, dog, star, bath, dance, book, lightbulb, wand]
      fx: { loop: gate-spelling-loop-arc }
    - type: ending-sound-gate
      weight: 0.0
      # Words per round: 1...9. Runtime snaps to a multiple of 3 in range when one exists.
      min_word_count: 2
      max_word_count: 2
      # Each word's LAST letter must exist in graphemes.yaml.
      words: [dog, wand, cloud, lightbulb, pencil]
      fx: { loop: gate-spelling-loop-arc }
    - type: sound-out-word-gate
      weight: 1.0
      # Capacitors offered per grapheme: 2...6.
      min_choice_count: 2
      max_choice_count: 4
      words: [cat, dog, star, car]
      fx: { loop: gate-spelling-loop-arc }
    - type: grapheme-sound-gate
      weight: 0.0
      min_grapheme_count: 4
      max_grapheme_count: 8
      graphemes: [a, b, c, d, e, f, g, h]
      fx: { switch_push: gate-grapheme_match-switch-push }
