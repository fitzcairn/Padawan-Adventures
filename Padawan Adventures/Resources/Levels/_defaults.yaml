# Level generation knobs (merged into world.yaml at load).
# Includes map size, generation, enemy spawn, pickups, and puzzle FX.
# Per-level files in Levels/<id>/level.yaml inherit from this base via `inherits: _defaults`.
# Inheritance: dictionaries merge key by key; arrays replace wholesale.

# Display name + VO live in Config/Catalogs/strings.yaml under this id.
name: level_default

# Plays the one-time tap-to-move / drag-to-look tutorial when the player first
# spawns into this level. Only the first level should enable it.
world_tutorial: false

# Level 1 curriculum (inherited by `_defaults` consumers and `1-tython`).
# Later levels replace this block wholesale with their own `vocab:`.
vocab:
  graphemes: [s, a, t, p, i, n]
  words: [at, it, in, an, sat, sit, pat, tap, pan, nap, pin, sip]

# Map layout, spawn rates, and exploration music.
world:
  # Background music track basename (Resources/Audio/Music/<name>.mp3).
  # Use `none` to keep previous music, or `silence` to fade out.
  music: level

  # Width and height of the level, in floor tiles.
  width_tiles: 35
  height_tiles: 35

  # How many rooms to place on the map.
  room_count: 15
  room:
    # Primary rooms: each axis of the final bounding box stays in [min, max].
    # Rect-mode L fillers may still stretch an arm to ~2x max_size_tiles.
    # shape: organic (cave blobs) | round-ish (nibbled disk) | rect
    min_size_tiles: 4
    max_size_tiles: 6
    shape: organic
    # Probability that a room contains a pit (at most one pit area per room).
    pit_probability: 0.60
    # Pit area size: mean tile count, capped at max.
    pit_mean_size_tiles: 5
    pit_max_size_tiles: 10
    # Probability that a join edge becomes a gated strip (miss → open doorway).
    gate_probability: 0.8

  # Floor decor sprinkle rate. The tile set itself is derived from the level folder
  # (Levels/<id>/<id>-floor-*), so levels only set `floor.set` to borrow other art.
  floor:
    decor_probability: 0.06
    # 0 = legacy per-cell variety (noisy), 1 = maximal patching (calm).
    cohesion_fraction: 0.75

  enemies:
    types: [spider]
    spawn_probability_per_room: 0.5

  pickups:
    health:
      # Fixed hearts per level (not a per-room roll).
      count: 3
    energy:
      spawn_probability_per_room: 0.8

  vocabulary:
    # P(draw from the current level's set); earlier levels split the rest geometrically.
    # Unused words/graphemes persist across minigames in a run, then the pool refills.
    current_level_probability: 0.75

# Combat minigames (one is baked onto each enemy at generation, weighted without
# replacement so equal weights yield equal counts). weight 0 = never.
# Overriding `minigames:` replaces the whole list — restate every entry you want to keep.
# Vocabulary for letter rings comes from the level's top-level `vocab:` block (cumulative).
# `grapheme-sound-combat`: wave-based swipe-to-slash arena. Each wave speaks one grapheme
#   pronunciation and launches that letter plus `min_decoy_count`...`max_decoy_count` other letters on
#   fanned, equal-speed curves. Slash the matching letter to reflect it into the enemy and
#   score; slashing a decoy stops that letter (flash + explode) and the rest immediately
#   finish their curves faster.
#   Letting any letter reach you costs one heart. Target graphemes are sampled without
#   replacement from the run's unused set (current-level graphemes more likely; case is
#   not part of identity), shared with other minigames until that set is empty, then
#   refilled. After a grapheme is chosen, `grapheme_case` is drawn for single letters
#   only; multi-letter graphemes stay lowercase. Decoys may repeat.
#   Flight time comes from enemies.yaml. Stars = waves cleared.
# `starting-sound-combat`: monster throws a word with its first grapheme blanked; tap the
#   orb to hear the word, then tap the ring for that missing sound. A wrong ring flashes
#   the letter in red on the blank and replays the word — the orb keeps flying. `ring_count`
#   (2–6) samples that many graphemes without replacement from the run's unused set
#   (current-level graphemes more likely), shared with other minigames until that set
#   is empty, then refilled. Thrown words are sampled the same way from
#   imaged pool entries; they must have only one valid ring answer for the visible blank
#   (no sit/sip or tris/trip collisions). Spellings avoid repeats until the unambiguous
#   pool is exhausted. Stars = orbs deflected.
# `ending-sound-combat`: same arena, but the ring must match the word's last grapheme.
combat:
  music: combat
  minigames:
    - type: grapheme-sound-combat
      weight: 1.0
      # Extra non-matching letters launched alongside the cued one, per wave.
      # Levels 4+ raise `max_decoy_count` to 6 via `_more_decoys`.
      min_decoy_count: 2
      max_decoy_count: 4
      grapheme_case: lower
      # How often to replay the current grapheme-pronunciation prompt while a wave is in flight.
      grapheme_sound_repeat_seconds: 3
    - type: starting-sound-combat
      weight: 1.0
      monster_hit_points: 5
      orb_travel_seconds: 8.0
      ring_count: 4
    - type: ending-sound-combat
      weight: 1.0
      monster_hit_points: 5
      orb_travel_seconds: 8.0
      ring_count: 4

# Pit minigames (one is baked onto each pit area at generation, weighted without
# replacement so equal weights yield equal counts). weight 0 = never.
# Overriding `minigames:` replaces the whole list — restate every entry you want to keep.
# Host `fx.jump` fires on every hop; `win` falls back to audio.yaml.
# Vocabulary comes from the level's top-level `vocab:` block (cumulative across earlier levels).
# `sound-out-word-pit`: sound out the word one grapheme at a time. Each grapheme fades in a
#   set of blank tiles; drag Kam onto the one whose sound comes next. Stars = graphemes in the
#   word. Words are imaged entries from the level pool whose graphemes are all in the pool,
#   sampled from the run's unused set like other minigames. Each turn's extra option
#   graphemes are sampled with replacement from the cumulative pool (current-level more
#   likely, same-length preferred) and added to the correct grapheme; they do not drain
#   the run's unused grapheme set. Set size is `min_choice_count`...`max_choice_count`
#   (2...6), rolled per grapheme.
# `ending-sound-pit`: drag the tile whose letter is the word's end sound into the dashed slot.
#   Words are imaged pool entries (>= 2 graphemes), sampled without replacement from the
#   run's unused set (current-level words more likely), shared with other minigames until
#   that set is empty, then refilled. The prompt shows that image and
#   plays the word's sfx. A wrong drop reshuffles the tray (same letters, new order).
#   Pool must hold at least `max_word_count` entries. Stars = words placed.
# `starting-sound-pit`: same board as `ending-sound-pit`, but the tile must match the word's
#   FIRST letter (`_og` for dog). Same pool rules. Stars = words placed.
pit:
  music: pit
  fx: { jump: pit-jump }
  minigames:
    - type: sound-out-word-pit
      weight: 1.0
      min_choice_count: 3
      max_choice_count: 4
    - type: ending-sound-pit
      weight: 1.0
      min_word_count: 3
      max_word_count: 5
    - type: starting-sound-pit
      weight: 1.0
      min_word_count: 3
      max_word_count: 5

# Gate minigames (triggered on gate tile contact).
# Overriding `minigames:` replaces the whole list — restate every entry you want to keep.
# Host `fx.opened` plays in the world when the gate strip opens.
# `minigame_probability` is P(run a puzzle); otherwise the gate opens freely with the opened SFX.
# Weights pick the kind baked onto each gate tile at generation time (weight 0 = never),
# without replacement so equal weights yield equal counts.
# Duplicate `type:` entries are rejected.
# Vocabulary comes from the level's top-level `vocab:` block (cumulative across earlier levels).
# `starting-sound-gate`: plug each word's missing first letter into its socket. Stars = words plugged.
#   Plays the starting-letter pronunciation when a plug is picked up. Word count is a uniform pick
#   in `min_word_count`...`max_word_count`. Words are sampled without replacement
#   from the run's unused set (current-level words more likely), shared with other minigames
#   until that set is empty, then refilled; tray letters stay unique.
# `ending-sound-gate`: same board as `starting-sound-gate`, but the plug must match the word's
#   LAST letter (`do_` for dog) and the socket sits to the right of the plate.
# `sound-out-word-gate`: sound out the prompted word one grapheme at a time. Each grapheme offers a
#   set of blank capacitors; drag the right one into the play area, left to right. Stars = graphemes
#   in the word. Extra options are sampled with replacement from the cumulative pool
#   (current-level more likely, same-length preferred) and added to the correct grapheme;
#   they do not drain the run's unused grapheme set. Set size is `min_choice_count`...
#   `max_choice_count` (2...6), rolled per grapheme.
# `grapheme-sound-gate`: hear a letter pronunciation and tap the matching switch. Stars = graphemes matched.
#   Round size is `min_grapheme_count`...`max_grapheme_count` clamped to the pool.
#   Graphemes are sampled without replacement from the run's unused set (current-level
#   graphemes more likely; case is not part of identity), shared with other minigames
#   until that set is empty, then refilled. After a grapheme is chosen,
#   `grapheme_case` (`lower`, `upper`, or `both`) is drawn for single letters only;
#   multi-letter graphemes stay lowercase. Idle replay uses `grapheme_sound_repeat_seconds`
#   from the last sound played.
gate:
  music: gate
  fx: { opened: gate-open }
  minigame_probability: 1.0
  minigames:
    - type: starting-sound-gate
      weight: 1.0
      # Words per round: 1...9.
      min_word_count: 3
      max_word_count: 8
      fx: { loop: gate-spelling-loop-arc }
    - type: ending-sound-gate
      weight: 1.0
      # Words per round: 1...9.
      min_word_count: 3
      max_word_count: 8
      fx: { loop: gate-spelling-loop-arc }
    - type: sound-out-word-gate
      weight: 1.0
      # Capacitors offered per grapheme: 2...6.
      min_choice_count: 3
      max_choice_count: 5
      fx: { loop: gate-spelling-loop-arc }
    - type: grapheme-sound-gate
      weight: 1.0
      grapheme_case: lower
      min_grapheme_count: 4
      max_grapheme_count: 8
      # Replay the target pronunciation if the player is idle this long after the last sound.
      grapheme_sound_repeat_seconds: 3
      fx: { switch_push: gate-grapheme_match-switch-push }
