# Floor terrain catalog — single-frame tiles from floor-spritesheet (2048×2048, 11×11).
# Sheet PNG + atlas JSON under Resources/Sprites/Floor/.

sprite:
  root: Sprites/Floor
  sheet: floor-spritesheet
  atlas_root: Sprites/Floor
  atlas: atlas
  # Near-white sheet background (often #FEFEFE); key pure white with a soft feather
  # band, then smooth the alpha matte so fringe doesn't leave a white halo.
  chroma_key: "#FFFFFF"
  chroma_key_tolerance: 18
  chroma_key_feather: 48
  chroma_key_smooth: 2

terrains:

  # Sandy desert dune
  sand:
    row: 0
    col: 0
    type: base
    accents: [boulder-red, boulder, boulder-wide, boulder-gray, rocks-small, rocks-pile, rocks-scatter, rocks-gray, rocks-dark, rocks-mixed]
