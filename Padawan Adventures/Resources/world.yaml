# Padawan Adventures — world (v1)
# All procedural generation is deterministic for a given seed + params.
# Use `seed: time` for a fresh seed from the clock on each new game, or a number to fix it.
# Map size and generation knobs live in level.yaml.

version: 1
seed: time

world:
  stories: 1

display:
  tile_width: 80
  tile_height: 40

enemies:
  type: grunt
  spawn_chance_per_room: 0.8

extensions: {}
