# Level generation knobs (merged into world.yaml at load).
# Per-level files in Levels/ inherit from this base via `inherits: base_level`.

name: Level

# Background music track basename (Resources/Audio/Music/<name>.m4a).
# Use `none` to keep previous music, or `silence` to fade out.
music: level_theme

# How often to replay the current letter-name prompt (combat cues, wall puzzle, etc.).
letter_sound_repeat_seconds: 3

# Max seconds a combat slash gesture stays active after the initial tap.
slash_max_seconds: 1

# Optional: override world.yaml `fx:` event keys for this level (partial merge).
# fx:
#   wall_destroyed: sfx_wall_destroyed_alt

width: 20
height: 20

algorithm: rooms_doors
# How many rooms to place on the map.
room_count: 5
corridor_width: 2
room:
  min_room_size: 4
  max_room_size: 12
  # Probability that a room contains a pit (at most one pit area per room).
  pit_chance: 0.2
  # Pit area size: mean tile count, capped at max.
  pit_mean_size: 2
  pit_max_size: 5
  wall_destructible_chance: 0.8
  # Probability that a door opening becomes a gate strip.
  gate_chance: 0.5

# Gate letter-puzzle minigame (triggered on gate tile contact).
# Stars awarded on win = number of letters in the solved word.
gate:
  timer_seconds: 30
  word_sound_repeat_seconds: 10
  win_sound: sfx_gate_win
  # Extra random letters beyond the chosen word (total sprites = word length + this).
  num_padding_letters: 6
  words:
    cat: sfx_word_cat
    dog: sfx_word_dog
    star: sfx_word_star
    gate: sfx_word_gate
    open: sfx_word_open

# Destructible-wall letter-matching minigame (triggered on soft-wall contact).
# Stars awarded on win = number of letters chosen for the round.
destructible_wall:
  timer_seconds: 30
  # Optional override; defaults to top-level `letter_sound_repeat_seconds`.
  incorrect_replay_delay_seconds: 1
  letter_count_mean: 4
  win_sound: sfx_wall_yay
  letters:
    a:
      pronunciation: sfx_letter_a_pronunciation
      name: sfx_letter_a_name
    b:
      pronunciation: sfx_letter_b_pronunciation
      name: sfx_letter_b_name
    c:
      pronunciation: sfx_letter_c_pronunciation
      name: sfx_letter_c_name
    d:
      pronunciation: sfx_letter_d_pronunciation
      name: sfx_letter_d_name
    e:
      pronunciation: sfx_letter_e_pronunciation
      name: sfx_letter_e_name
    f:
      pronunciation: sfx_letter_f_pronunciation
      name: sfx_letter_f_name
    g:
      pronunciation: sfx_letter_g_pronunciation
      name: sfx_letter_g_name
    h:
      pronunciation: sfx_letter_h_pronunciation
      name: sfx_letter_h_name

pickups:
  health:
    spawn_chance_per_room: 0.8
  energy:
    spawn_chance_per_room: 0.8
