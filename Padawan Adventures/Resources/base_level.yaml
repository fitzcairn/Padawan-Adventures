# Level generation knobs (merged into world.yaml at load).
# Per-level files in Levels/ inherit from this base via `inherits: base_level`.

name: Level

# Background music track basename (Resources/Audio/Music/<name>.m4a).
# Use `none` to keep previous music, or `silence` to fade out.
music: level_theme

# Optional: override world.yaml `fx:` event keys for this level (partial merge).
# fx:
#   wall_destroyed: sfx_wall_destroyed_alt

width: 20
height: 20

algorithm: rooms_doors
# How many rooms to place on the map.
room_count: 5
corridor_width: 2
room:
  min_room_size: 4
  max_room_size: 12
  # Probability that a room contains a pit (at most one pit area per room).
  pit_chance: 0.2
  # Pit area size: mean tile count, capped at max.
  pit_mean_size: 2
  pit_max_size: 5
  wall_destructible_chance: 0.8
  # Probability that a door opening becomes a gate strip.
  gate_chance: 0.5

# Gate letter-puzzle minigame (triggered on gate tile contact).
# Stars awarded on win = number of letters in the solved word.
gate:
  timer_seconds: 30
  word_sound_repeat_seconds: 10
  win_sound: sfx_gate_win
  # Extra random letters beyond the chosen word (total sprites = word length + this).
  num_padding_letters: 6
  words:
    cat: sfx_word_cat
    dog: sfx_word_dog
    star: sfx_word_star
    gate: sfx_word_gate
    open: sfx_word_open

pickups:
  health:
    spawn_chance_per_room: 0.8
  energy:
    spawn_chance_per_room: 0.8
