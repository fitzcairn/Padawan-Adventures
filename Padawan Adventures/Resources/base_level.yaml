# Level generation knobs (merged into world.yaml at load).
# Includes map size, generation, enemy spawn, pickups, and puzzle FX.
# Per-level files in Levels/ inherit from this base via `inherits: base_level`.

name: Level

# Background music track basename (Resources/Audio/Music/<name>.m4a).
# Use `none` to keep previous music, or `silence` to fade out.
music: level_theme

# Per-minigame music for this level (same cue rules as `music:`).
game_music:
  combat: combat_theme
  pit: pit_theme
  destructible_wall: destructible_wall_theme
  gate: gate_theme

# How often to replay the current letter-name prompt (combat cues, wall puzzle, etc.).
letter_sound_repeat_seconds: 3

width: 20
height: 20

# Default floor terrain palette (overridden per level). Ids from terrain.yaml.
floor_sprites:
  - dirt
  - grass
  - grass-lush
  - hedge
  - bush
  - foliage
  - earth-sprout
  - undergrowth

algorithm: rooms_doors
# How many rooms to place on the map.
room_count: 5
corridor_width: 2
room:
  min_room_size: 4
  max_room_size: 12
  # Probability that a room contains a pit (at most one pit area per room).
  pit_chance: 0.2
  # Pit area size: mean tile count, capped at max.
  pit_mean_size: 2
  pit_max_size: 5
  wall_destructible_chance: 0.8
  # Probability that a door opening becomes a gate strip.
  gate_chance: 0.5

# Pit spelling-hop minigame (triggered on pit tile contact).
# Stars awarded on win = number of letters in the solved word.
# Optional `win_sound` / `fail_sound` override shared `sound.yaml` (`fx.win` / `fx.lose`).
pit:
  timer_seconds: 30
  win_sound: sfx_pit_yay
  fail_sound: sfx_pit_fall
  # Extra random letters beyond the chosen word (total sprites = word length + this).
  num_padding_letters: 6
  # Selectable pit words for this level (keys into shared `Vocab/words.yaml`).
  words: [cat, dog, star]

# Gate letter-puzzle minigame (triggered on gate tile contact).
# Stars awarded on win = number of letters in the solved word.
# Optional `win_sound` overrides shared `sound.yaml` (`fx.win`).
gate:
  timer_seconds: 30
  # Played in the world when the gate strip opens after a win.
  gate_opened: sfx_gate_opened
  # Extra random letters beyond the chosen word (total sprites = word length + this).
  num_padding_letters: 6
  # Selectable gate words for this level (keys into shared `Vocab/words.yaml` for spelling/progressive FX).
  words: [cat, dog, star, gate, open]

# Destructible-wall letter-matching minigame (triggered on soft-wall contact).
# Stars awarded on win = number of letters chosen for the round.
# Optional `correct_sound` overrides shared `sound.yaml` (`fx.correct`).
destructible_wall:
  timer_seconds: 30
  # Inclusive range for how many letters appear in a round (clamped to the letter pool).
  letter_count_min: 4
  letter_count_max: 8
  # Played in the world when the soft wall is destroyed after a win.
  wall_destroyed: sfx_wall_destroyed
  # Selectable letters for this level (keys into shared `Vocab/letters.yaml` for pronunciation/name FX).
  letters: [a, b, c, d, e, f, g, h]

enemies:
  types: [horranth]
  spawn_chance_per_room: 0.8

pickups:
  health:
    spawn_chance_per_room: 0.8
  energy:
    spawn_chance_per_room: 0.8
